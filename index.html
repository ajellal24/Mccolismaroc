<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f5c6e">
<title>MCCOLIS MAROC</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MCCOLIS">
<style>
:root{--ink:#1c2630;--mut:#66727e;--bg:#faf7f1;--line:#e8e2d6;--teal:#0f5c6e;--teal2:#0b4553;--gold:#e9a31b;--wa:#1faa59;--red:#c2410c;--ws:#7c3aed}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",Tahoma,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1000px;margin:auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-weight:800;font-size:1.15rem}.logo b{color:var(--gold)}
.tools{display:flex;gap:8px}
.pill{background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:6px 12px;font-size:.9rem;font-weight:600;position:relative}
.pill span{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--gold);color:var(--ink);min-width:20px;height:20px;border-radius:10px;font-size:.75rem;display:grid;place-items:center;font-weight:800}
.hero{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:24px 0 28px}
.hero h1{font-size:1.55rem;line-height:1.35;max-width:560px}
.hero p{margin:8px 0 0;opacity:.92;max-width:540px}
.ban{background:#ede9fe;color:#4c1d95;border-radius:10px;padding:9px 12px;margin-top:14px;font-size:.88rem}
.demo{background:#fff3d6;border:1px solid #f0d58a;border-radius:10px;padding:9px 12px;margin-top:12px;font-size:.84rem}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600}
.cat[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.search{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 0 30px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:2rem}}
.p{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:1/1;display:grid;place-items:center;font-size:3.4rem;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;height:100%;scrollbar-width:none}.sl::-webkit-scrollbar{display:none}.sl img,.sl video{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;background:#000}
.dots{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.25)}.dots i.on{background:var(--teal,#0e7490)}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--red);color:#fff;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px}
.so{position:absolute;inset:0;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:1rem;font-weight:800;color:var(--red)}
.info{padding:10px 11px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.nm{font-size:.95rem;font-weight:700;line-height:1.35}
.ds{font-size:.8rem;color:var(--mut)}
.pl{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;gap:6px}
.pl b{font-size:1rem;color:var(--teal)}
.pl.w b{color:var(--ws)}
.stk{font-size:.75rem;color:var(--mut)}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between}
.qty{display:flex;align-items:center}
.qty button{width:32px;height:32px;border-radius:8px;background:#efeae0;font-weight:800}
.qty span{min-width:28px;text-align:center;font-weight:700}
.qty button:disabled{opacity:.4}
.mini{font-size:.74rem;background:#ede9fe;color:#4c1d95;border-radius:8px;padding:6px 8px;font-weight:700}
.ct{display:flex;justify-content:space-between;align-items:center;background:#f4f1ea;border-radius:9px;padding:6px 9px;font-size:.8rem}
.ct b{font-size:1.02rem}
.ct.ws{background:#ede9fe;color:#4c1d95}
.add{background:var(--teal);color:#fff;border-radius:9px;padding:9px;font-weight:700}
.wab{background:#e7f7ee;color:#117a3d;border-radius:9px;padding:8px;font-weight:700;font-size:.88rem}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px 0}
footer{background:var(--ink);color:#cfd6dc;padding:20px 0 90px;font-size:.88rem}
footer b{color:#fff}
.float{position:fixed;bottom:16px;inset-inline-start:16px;z-index:15;background:var(--wa);color:#fff;border-radius:99px;padding:12px 18px;font-weight:700;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none}.shade.on{display:block}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(430px,100%);background:#fff;z-index:31;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s}
[dir=rtl] .drawer{transform:translateX(-100%)}
.drawer.on{transform:none!important}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:1.1rem}
.db{flex:1;overflow-y:auto;padding:8px 16px}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it .top{display:flex;gap:10px;align-items:center}
.it .e{font-size:1.6rem;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;overflow:hidden}
.it .e img{width:100%;height:100%;object-fit:cover}
.it .t{flex:1;font-size:.9rem}
.it small{display:block;color:var(--mut);font-size:.78rem}
.hint{font-size:.78rem;color:#4c1d95;background:#f5f3ff;border-radius:8px;padding:5px 8px;margin-top:6px}
.badge{background:var(--ws);color:#fff;border-radius:6px;font-size:.7rem;padding:1px 7px;font-weight:700}
.df{border-top:1px solid var(--line);padding:12px 16px;background:#fcfaf5;max-height:62vh;overflow-y:auto}
.sub{display:flex;justify-content:space-between;color:var(--mut);font-size:.88rem}
.sub.g{color:#117a3d;font-weight:700}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;margin:6px 0 8px}
form{display:grid;gap:8px;margin-top:8px}
form input,form select,form textarea{width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);background:#fff}
.bad{border-color:var(--red)!important}
.info2{font-size:.84rem;background:#f4f1ea;border-radius:9px;padding:8px 10px}
.send{background:var(--wa);color:#fff;border-radius:10px;padding:12px;font-weight:800;width:100%}
.x{font-size:1.4rem;padding:2px 8px}
.note{font-size:.76rem;color:var(--mut)}
.err{color:var(--red);font-size:.82rem;min-height:1em}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:.88rem;z-index:40;display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.shade2{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}.shade2.on{display:block}
.rv{position:fixed;left:0;right:0;margin:auto;bottom:0;width:min(560px,100%);max-height:85vh;overflow:auto;background:#fff;z-index:51;border-radius:18px 18px 0 0;padding:16px 14px 22px;transform:translateY(105%);transition:transform .25s}.rv.on{transform:none}
.rv .x{position:absolute;top:10px;inset-inline-start:12px;border:0;background:#eee;border-radius:50%;width:30px;height:30px;cursor:pointer}
.rv h3{font-size:1rem;margin:0 40px 6px}.rsum{margin-bottom:6px}
.st{color:#f5a623;letter-spacing:1px}.st.big{font-size:1.3rem}
.rt{background:none;border:0;padding:0;font-size:.8rem;color:#66727e;text-align:start;cursor:pointer;font-family:inherit}
.rc{border-top:1px solid #eee;padding:8px 0;font-size:.88rem}.rc p{margin:3px 0}.rc small{color:#888}
.pick button{background:none;border:0;font-size:1.9rem;color:#d4d4d4;padding:0 2px;cursor:pointer}.pick button.on{color:#f5a623}
#rvf{display:flex;flex-direction:column;gap:8px;margin-top:12px}#rvf input,#rvf textarea{padding:10px;border:1.5px solid #e0dacc;border-radius:10px;font:inherit}
.rdone{margin-top:12px;font-weight:700;color:#117a3d}
.old{color:#8a8f98;font-weight:400;font-size:.8em;margin-inline-end:4px}
.cd{font-size:.78rem;color:#c2410c;font-weight:600}.cd b{font-variant-numeric:tabular-nums}
.tag.d{background:#c2410c}
.p{border-radius:16px;box-shadow:0 2px 10px rgba(30,27,75,.08)}
.hot{position:absolute;top:8px;inset-inline-end:8px;background:linear-gradient(90deg,#f97316,#ef4444);color:#fff;font-size:.74rem;font-weight:800;padding:3px 10px;border-radius:99px;z-index:2;box-shadow:0 2px 6px rgba(239,68,68,.4)}
.tag{z-index:2;font-size:.78rem;padding:3px 9px;border-radius:8px}
.sku{font-size:.72rem;color:#8a8f98;letter-spacing:.6px;font-weight:600}
.nm{font-size:1.05rem;font-weight:800;color:#1e1b4b}
.rt{display:flex;align-items:center;gap:5px;font-size:.84rem}.rt b{color:#1c2630}.rt .cnt{color:#8a8f98;font-size:.78rem}
.chip{display:inline-block;background:#e8edff;color:#3730a3;border-radius:99px;padding:3px 11px;font-size:.76rem;font-weight:700}
.price{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}.price b{font-size:1.3rem;color:#1e1b4b}.price s{color:#8a8f98;font-size:.88rem}
.ds{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.add{background:#4f46e5;border-radius:12px;padding:11px;font-size:.95rem}
.ic{display:inline-block;vertical-align:middle;object-fit:contain}
.pill{display:inline-flex;align-items:center;gap:5px}
#ban:not([hidden]){display:flex;align-items:center;gap:8px}
.x{display:inline-flex;align-items:center;justify-content:center;background:none;border:0}
.sub span:first-child{display:inline-flex;align-items:center;gap:6px}
.cd{display:flex;align-items:center;gap:5px}
.rc{display:flex;gap:10px}.rc .av{flex:none;width:38px;height:38px;border-radius:50%;background:#e8edff;display:grid;place-items:center;overflow:hidden;font-weight:800;color:#3730a3}
.rc .av img{width:100%;height:100%;object-fit:cover;object-position:top}
.rc .bd{flex:1;min-width:0}.rc small{display:inline-flex;align-items:center;gap:4px}
.avp{display:flex;gap:10px;align-items:center}.avp button{border:2px solid transparent;border-radius:50%;width:50px;height:50px;padding:0;background:#e8edff;overflow:hidden;cursor:pointer}
.avp button.on{border-color:#4f46e5;box-shadow:0 0 0 2px #c7d2fe}.avp img{width:100%;height:100%;object-fit:cover;object-position:top}
.avp span{font-size:.8rem;color:#66727e}
.rdone,.err{display:flex;align-items:center;gap:6px}
[data-open]{cursor:pointer}
.lp{position:fixed;top:56px;bottom:0;left:0;right:0;background:var(--bg);z-index:19;overflow:auto;display:none}.lp.on{display:block}
.lp .in{max-width:640px;margin:auto;padding:12px 14px 90px}
.lpb{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;margin-bottom:10px}
.lp .pic{border-radius:16px;overflow:hidden}
.lp h1{font-size:1.3rem;color:#1e1b4b;margin:4px 0 2px}
.lpd{white-space:pre-line;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:.96rem;line-height:1.8}
.lph{font-weight:800;margin:18px 0 6px;font-size:1.02rem}
.lpv iframe,.lpv video{width:100%;border:0;border-radius:14px;background:#000;display:block}.lpv iframe{aspect-ratio:16/9}.lpv video{max-height:75vh}
.lpact{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.lp .sku{font-size:.8rem}.lp h1{font-size:1.35rem;line-height:1.5}
.ths{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:4px;scrollbar-width:none}.ths::-webkit-scrollbar{display:none}
.ths button{flex:none;width:62px;height:62px;border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:#fff}.ths img{width:100%;height:100%;object-fit:cover}
.pbox{background:linear-gradient(135deg,#eef2ff,#fff);border:1px solid #dfe3ff;border-radius:14px;padding:12px 14px;margin:10px 0}
.pbox .price b{font-size:1.8rem}.sv{background:#16a34a;color:#fff;border-radius:8px;padding:2px 8px;font-size:.78rem;font-weight:700}
.urg{color:#c2410c;font-weight:800;font-size:.88rem;margin-top:4px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.trust div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:.72rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.wbox{display:flex;align-items:center;gap:12px;background:#f5f0ff;border:1px solid #e0d4ff;border-radius:14px;padding:10px 14px;margin:6px 0;color:#4c1d95}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.feat li{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.93rem}.feat li .ic{flex:none;margin-top:2px}
.steps{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.sims{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sim{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px;font-size:.85rem}.sim .sp{aspect-ratio:1/1;border-radius:10px;overflow:hidden;display:grid;place-items:center}.sim .sp img{width:100%;height:100%;object-fit:cover}.sim span{color:#4f46e5;font-weight:800}
.lpbar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;background:#fff;border-top:1px solid var(--line);padding:10px 14px;box-shadow:0 -4px 14px rgba(0,0,0,.08);max-width:none}
.lpbar .pp{display:flex;flex-direction:column;line-height:1.2}.lpbar .pp b{font-size:1.15rem;color:#1e1b4b}.lpbar .pp small{color:var(--mut);font-size:.7rem}
.lpbar .buy{flex:1;background:#4f46e5;color:#fff;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:1rem;font-family:inherit;cursor:pointer}
.lpbar .wa2{width:48px;height:48px;border:0;cursor:pointer;border-radius:12px;background:var(--wa);display:grid;place-items:center;text-decoration:none;font-size:1.4rem}
.lp .in{padding-bottom:20px}
.wsi{background:linear-gradient(135deg,#f5f0ff,#fff);border:1px solid #e0d4ff;border-radius:18px;padding:18px 16px;margin:0 0 24px}
.wsi h2{font-size:1.25rem;color:var(--ws);margin-bottom:4px}
.wsi .wsub{color:var(--mut);font-size:.88rem;margin-bottom:14px}
.wsc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.wsc div{background:#fff;border:1px solid #e0d4ff;border-radius:14px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.wsc b{font-size:1.7rem;color:var(--ws);line-height:1.1}
.wsc span{font-size:.78rem;font-weight:700;color:var(--ink)}
.wsi ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;font-size:.93rem}
.wsi li{display:flex;gap:8px;align-items:flex-start}
.wsi li::before{content:"✔";color:var(--wa);font-weight:800}
.wsi .wsb{display:block;text-align:center;margin-top:14px;background:var(--wa);color:#fff;border-radius:12px;padding:12px;font-weight:800;text-decoration:none}
</style>
<style>.topban{display:block;background:#0a0912;line-height:0}.topban img{display:block;width:100%;max-width:480px;height:auto;margin:0 auto}@media(min-width:700px){.topban img{max-width:720px}}</style>
<style>.mainban{background:#fff;line-height:0}.mainban img{display:block;width:100%;max-width:900px;height:auto;margin:0 auto}</style>
<style>.supp{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;background:linear-gradient(135deg,#fff,#eef7f9);border:1px solid var(--line);border-radius:18px;padding:18px 16px 0;margin:0 0 24px;overflow:hidden}.suptx{flex:1;padding-bottom:18px}.supp h2{font-size:1.2rem;color:var(--teal);margin-bottom:6px}.supp p{color:var(--mut);font-size:.9rem;margin-bottom:12px}.supb{display:block;text-align:center;background:var(--wa);color:#fff;border-radius:12px;padding:11px;font-weight:800;text-decoration:none;margin-top:8px}.supb.call{background:var(--teal)}.supp img{width:42%;max-width:260px;height:auto;display:block;flex:none}@media(max-width:480px){.supp img{width:40%}.supp h2{font-size:1.05rem}}</style>
<style>.dlv{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin:0 0 16px}.dlv img{width:84px;height:auto;flex:none;mix-blend-mode:multiply}.dlv h2{font-size:1.1rem;color:var(--teal);margin-bottom:2px}.dlv p{color:var(--mut);font-size:.88rem}</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="logo">MCCOLIS <b>MAROC</b></div>
  <div class="tools">
    <button class="pill" id="lang">FR</button>
    <button class="pill" id="openCart"><span id="cnt">0</span><i id="cartL"></i></button>

const hasW = p => p.wholesale>0 && p.wholesale<p.retail;
const isWs = (p,q) => hasW(p) && q>=p.min;
const unit = (p,q) => isWs(p,q) ? p.wholesale : p.retail;
const lineTotal = (p,q) => unit(p,q)*q;
const lineSave = (p,q) => isWs(p,q) ? (p.retail-p.wholesale)*q : 0;

function totals(){
  let sub=0,saved=0,n=0,ws=0,rt=0;
  for(const id in cart){ const p=P(id); if(!p) continue; const q=cart[id];
    sub+=lineTotal(p,q); saved+=lineSave(p,q); n+=q; isWs(p,q)?ws++:rt++; }
  const s=DB.settings, ship = sub===0?0:(sub>=s.freeFrom?0:s.shipping);
  const type = ws&&rt?"tmix":ws?"tws":"trt";
  return {sub,saved,n,ship,total:sub+ship,type};
}
function clampCart(){
  let changed=false;
  for(const id in cart){ const p=P(id);
    if(!p||p.stock<=0){delete cart[id];changed=true;continue}
    if(cart[id]>p.stock){cart[id]=p.stock;changed=true}
    if(cart[id]<1){delete cart[id];changed=true} }
  return changed;
}

   <div class="tot"><span>${t("total")}</span><span>${money(T0.total)}</span></div>
   <form id="order" novalidate>
    <input id="fn" autocomplete="name" placeholder="${t("name")}">
    <input id="fp" type="tel" inputmode="tel" autocomplete="tel" placeholder="${t("phone")}">
    <select id="fc"><option value="">${t("city")}</option>${CITIES.map(c=>`<option>${c}</option>`).join("")}</select>
    <textarea id="fa" rows="2" autocomplete="street-address" placeholder="${t("address")}"></textarea>
    <div class="info2">${t("stype")}: <b>${t(T0.type)}</b><br>${t("pay")}</div>
    <div class="err" id="err"></div>
    <button class="send" type="submit">${t("send")}</button><div class="note">${t("note")}</div></form>`;

function applyLang(){
  const L=T[lang];
  document.documentElement.lang=lang; document.documentElement.dir=L.dir;
  $("#lang").innerHTML=ic("globe",16)+" "+L.lang; $("#cartL").textContent=L.cart; $("#h1").textContent=L.h1; $("#sub").textContent=L.sub;
  $("#q").placeholder=L.search; $("#foot").textContent=L.foot; $("#wsInfo").innerHTML=`<h2>${L.wsT}</h2><p class="wsub">${L.wsSub}</p><div class="wsc">${L.wsC.map(c=>`<div><b>${c[0]}</b><span>${c[1]}</span></div>`).join("")}</div><ul>${L.wsL.map(x=>`<li><span>${esc(x)}</span></li>`).join("")}</ul><a class="wsb" target="_blank" rel="noopener" href="https://wa.me/${DB.settings.whatsapp}?text=${encodeURIComponent(L.wsMsg)}">${L.wsBtn}</a>`; $("#cartT").textContent=L.cartT;
  const b=DB.settings.banner&&DB.settings.banner[lang]; $("#ban").hidden=!b; $("#ban").innerHTML=b?ic("bell",26)+"<span>"+esc(b)+"</span>":"";
  
  $("#dlvT").textContent=L.tr1;$("#dlvP").textContent=L.tr2+" · "+L.tr3;$("#supT").textContent=L.supT;$("#supP").textContent=L.supP;$("#supWa").textContent=L.supWa;$("#supWa").href="https://wa.me/"+DB.settings.whatsapp+"?text="+encodeURIComponent(L.waGen);
  $("#waFloat").href="https://wa.me/"+DB.settings.whatsapp+"?text="+encodeURIComponent(L.waGen);

}
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",1600)}

const redraw = id => { const el=$("#c"+id); if(el) el.outerHTML=card(P(id)); if(lpId==id&&$("#lpAct"))$("#lpAct").innerHTML=lpAct(P(id)); };

document.addEventListener("click",e=>{
  const g=a=>e.target.closest("["+a+"]");
  let x;
  if(x=g("data-cq")){const id=x.dataset.cq,p=P(id);cq[id]=Math.min(p.stock,Math.max(1,(cq[id]||1)+Number(x.dataset.d)));redraw(id)}
  else if(x=g("data-cmin")){const id=x.dataset.cmin;cq[id]=P(id).min;redraw(id)}
  else if(x=g("data-add")){const id=x.dataset.add,p=P(id);cart[id]=Math.min(p.stock,(cart[id]||0)+(cq[id]||1));save();renderCart();toast(t("added"))}
  else if(x=g("data-wa")){const id=x.dataset.wa,p=P(id),q=cq[id]||1;
    const m=[t("waOne"),`${p[lang]} × ${q}`,`${t(isWs(p,q)?"wsTag":"rtTag")}: ${money(unit(p,q))} ${t("unit")}`,`${t("sub2")}: ${money(lineTotal(p,q))}`].join("\n");
    window.open("https://wa.me/"+DB.settings.whatsapp+"?text="+encodeURIComponent(m),"_blank")}
  else if(x=g("data-c")){cat=x.dataset.c;renderCats();renderGrid()}
  else if(x=g("data-q")){const id=x.dataset.q,p=P(id);cart[id]=Math.min(p.stock,(cart[id]||0)+Number(x.dataset.d));if(cart[id]<=0)delete cart[id];save();renderCart()}
});
$("#q").addEventListener("input",e=>{qtext=e.target.value;renderGrid()});
$("#lang").addEventListener("click",()=>{lang=lang==="ar"?"fr":"ar";save();applyLang()});
$("#openCart").addEventListener("click",()=>openCart(true));
$("#closeCart").addEventListener("click",()=>openCart(false));
$("#shade").addEventListener("click",()=>openCart(false));
document.addEventListener("keydown",e=>{if(e.key==="Escape")openCart(false)});

document.addEventListener("submit",async e=>{
  if(e.target.id!=="order")return; e.preventDefault();
  if(clampCart()){save();renderCart();$("#err").textContent=t("stockErr");return}
  const f={n:$("#fn"),p:$("#fp"),c:$("#fc"),a:$("#fa")}, phone=f.p.value.replace(/[\s.\-]/g,"");
  const ok={n:f.n.value.trim().length>=3,p:/^(\+212|00212|0)[5-7]\d{8}$/.test(phone),c:!!f.c.value,a:f.a.value.trim().length>=8};
  for(const k in f)f[k].classList.toggle("bad",!ok[k]);
  if(!(ok.n&&ok.p&&ok.c&&ok.a)){$("#err").textContent=t("need");return}
  const btn=e.target.querySelector(".send"); btn.disabled=true; $("#err").textContent="";
  const lines0=Object.keys(cart).map(id=>{const p=P(id),q=cart[id];
    return `• ${p[lang]} × ${q} [${t(isWs(p,q)?"wsTag":"rtTag")}] ${money(unit(p,q))} ${t("unit")} = ${money(lineTotal(p,q))}`});
  let ord=null;
  if(SYNC){ try{
    const items=Object.keys(cart).map(id=>({id:Number(id),qty:cart[id]}));
    const r=await sb("rpc/place_order",{method:"POST",body:JSON.stringify({p_name:f.n.value.trim(),p_phone:phone,p_city:f.c.value,p_address:f.a.value.trim(),p_items:items})});
    const j=await r.json();
    if(r.ok) ord=j;
    else if(/out_of_stock|not_found/.test(JSON.stringify(j))){await loadData();clampCart();save();applyLang();$("#err").textContent=t("stockErr");btn.disabled=false;return}
  }catch(_){} }
  const T0=ord?{sub:ord.subtotal,saved:ord.savings,ship:ord.shipping,total:ord.total,type:{wholesale:"tws",retail:"trt",mixed:"tmix"}[ord.type]}:totals();
  const msg=[t("waHi"),...(ord?[`${t("orderNo")}: #${ord.id}`]:SYNC?[t("unsaved")]:[]),"",...lines0,"",`${t("stype")}: ${t(T0.type)}`,`${t("sub2")}: ${money(T0.sub)}`,
   ...(T0.saved?[`${t("saved")}: ${money(T0.saved)}`]:[]),`${t("ship")}: ${T0.ship?money(T0.ship):t("free")}`,`*${t("total")}: ${money(T0.total)}*`,"",
   `${t("waC")}:`,`${t("waN")}: ${f.n.value.trim()}`,`${t("waP")}: ${phone}`,`${t("waCi")}: ${f.c.value}`,`${t("waA")}: ${f.a.value.trim()}`,"",t("pay")].join("\n");
  const url="https://wa.me/"+DB.settings.whatsapp+"?text="+encodeURIComponent(msg);
  const head=ord?`${t("savedOk")} (#${ord.id})`:(SYNC?t("unsaved"):"");
  if(ord){cart={};save();renderCart();loadData().then(()=>renderGrid())}
  $("#fform").innerHTML=`<p style="margin:6px 0 12px;font-weight:700">${esc(head)}</p><a class="send" style="display:block;text-align:center;text-decoration:none" href="${url}" target="_blank" rel="noopener">${t("openWa")}</a>`;
});

const disc = p => p.old_price>p.retail && (!p.offer_end || new Date(p.offer_end)>Date.now());
const pct = p => Math.round((1-p.retail/p.old_price)*100);
const normP = p => { if(p.old_price && p.offer_end && new Date(p.offer_end)<=Date.now()){p.retail=p.old_price;p.old_price=null;p.offer_end=null;p.offer=false} return p };
function cdText(end){ let s=Math.max(0,Math.floor((new Date(end)-Date.now())/1000)); const d=Math.floor(s/86400); s%=86400;
  const p2=n=>String(n).padStart(2,"0"); return (d?d+t("dd")+" ":"")+p2(Math.floor(s/3600))+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60); }
let REV=[], rvId=null, rvStar=0, rvAv="", expiring=false;
const stat = id => { const l=REV.filter(r=>r.product_id==id); return {n:l.length, avg:l.length?l.reduce((s,r)=>s+r.rating,0)/l.length:0} };
const stars = v => "★".repeat(Math.round(v))+"☆".repeat(5-Math.round(v));
const ratingBtn = p => { const s=stat(p.id); return `<button class="rt" data-rev="${p.id}">${s.n?`<span class="st">${stars(s.avg)}</span> <b>${s.avg.toFixed(1)}</b> <span class="cnt">(${s.n} ${t("rvw")})</span>`:`☆ ${t("rate")}`}</button>`; };
async function loadReviews(){ if(!SB_ON)return; try{const r=await sb("reviews?select=*&order=created_at.desc&limit=500"); if(r.ok)REV=await r.json()}catch(_){} }
function renderRev(){
  const p=P(rvId); if(!p)return; const l=REV.filter(r=>r.product_id==rvId), s=stat(rvId); let done=false;
  try{done=!!localStorage.getItem("mm_rev_"+rvId)}catch(_){}
  $("#rvBody").innerHTML=`<h3>${ic("chat_people",26)} ${esc(p[lang])}</h3>
   <div class="rsum">${s.n?`<span class="st big">${stars(s.avg)}</span> <b>${s.avg.toFixed(1)}</b> / 5 · ${s.n}`:t("noRev")}</div>
   <div>${l.map(r=>`<div class="rc"><div class="av">${r.avatar==="m"?`<img src="${IC.avatar_male}" alt="">`:r.avatar==="f"?`<img src="${IC.avatar_female}" alt="">`:esc((r.name||"?").trim().charAt(0).toUpperCase())}</div><div class="bd"><div><b>${esc(r.name)}</b> <span class="st">${stars(r.rating)}</span></div>${r.comment?`<p>${esc(r.comment)}</p>`:""}<small>${ic("calendar",13)} ${new Date(r.created_at).toLocaleDateString(lang==="ar"?"ar-MA-u-nu-latn":"fr-FR")}</small></div></div>`).join("")}</div>
   ${SYNC?(done?`<p class="rdone">${ic("check",24)} ${t("already")}</p>`:`<form id="rvf" novalidate><div class="avp" id="avp"><button type="button" data-av="m" aria-label="m"><img src="${IC.avatar_male}" alt=""></button><button type="button" data-av="f" aria-label="f"><img src="${IC.avatar_female}" alt=""></button><span>${t("pickAv")}</span></div>
    <div class="pick" id="pick">${[1,2,3,4,5].map(k=>`<button type="button" data-star="${k}">★</button>`).join("")}</div>
    <input id="rn" maxlength="40" placeholder="${t("yourName")}"><textarea id="rc" rows="3" maxlength="500" placeholder="${t("yourCom")}"></textarea>
    <div class="err" id="rerr"></div><button class="send" type="submit">${t("sendRev")}</button></form>`):""}`;
}
function openRev(id){ rvId=id; rvStar=0; rvAv=""; renderRev(); $("#rv").classList.add("on"); $("#shade2").classList.add("on"); document.body.style.overflow="hidden"; }
function closeRev(){ $("#rv").classList.remove("on"); $("#shade2").classList.remove("on"); document.body.style.overflow=""; }
document.addEventListener("click",e=>{ const g=a=>e.target.closest("["+a+"]"); let x;
  if(x=g("data-rev"))openRev(x.dataset.rev);
  else if(x=g("data-star")){rvStar=+x.dataset.star;document.querySelectorAll("#pick button").forEach(b=>b.classList.toggle("on",+b.dataset.star<=rvStar))}
  else if(x=g("data-av")){rvAv=x.dataset.av;document.querySelectorAll("#avp button").forEach(b=>b.classList.toggle("on",b.dataset.av===rvAv))}
  else if(g("data-rvx"))closeRev(); });
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeRev()});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="rvf")return; e.preventDefault();
  const name=$("#rn").value.trim(), com=$("#rc").value.trim();
  if(name.length<2||!rvStar){$("#rerr").innerHTML=ic("error",16)+" "+esc(t("revNeed"));return}
  const btn=e.target.querySelector(".send"); btn.disabled=true; $("#rerr").textContent="";
  try{ const row={product_id:Number(rvId),name,rating:rvStar,comment:com||null};
    const post=b=>sb("reviews",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(b)});
    let r=await post(rvAv?{...row,avatar:rvAv}:row);
    if(!r.ok&&rvAv)r=await post(row);
    if(!r.ok)throw 0; try{localStorage.setItem("mm_rev_"+rvId,"1")}catch(_){}
    e.target.outerHTML=`<p class="rdone">${ic("check",24)} ${t("thanks")}</p>`;
  }catch(_){ $("#rerr").innerHTML=ic("error",16)+" "+esc(t("revErr")); btn.disabled=false; } });
setInterval(()=>{ let gone=false;
  document.querySelectorAll("[data-end]").forEach(el=>{ if(new Date(el.dataset.end)<=Date.now())gone=true; else el.textContent=cdText(el.dataset.end) });
  if(gone&&!expiring){expiring=true; DB.products.forEach(normP);
    (async()=>{ try{await sb("rpc/expire_offers",{method:"POST",body:"{}"})}catch(_){} await loadData(); clampCart(); save(); renderGrid(); renderCart(); expiring=false })(); } },1000);

Object.assign(T.fr,{saveT:"Économisez",onlyL:"Plus que",tr1:"Livraison partout au Maroc",tr2:"Paiement à la livraison",tr3:"Support WhatsApp",featT:"Points forts",howT:"Comment commander ?",st1:"Choisissez la quantité et ajoutez au panier",st2:"Remplissez nom, téléphone, ville et adresse",st3:"Recevez votre commande et payez à la livraison",revT:"Avis des clients",simT:"Produits similaires",buyNow:"Commander",back:"Retour",descT:"Description du produit",vidT:"Vidéo du produit",share:"Partager le lien",copied:"Lien du produit copié"});
let lpId=null, lpInternal=false;
function videoHtml(u){ const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);
  return m?`<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen loading="lazy"></iframe>`:`<video src="${esc(u)}" controls playsinline preload="metadata"></video>`; }
function lpAct(p){
  const out=p.stock<=0, qn=out?1:Math.min(Math.max(cq[p.id]||1,1),p.stock); cq[p.id]=qn; const ws=isWs(p,qn);
  if(out) return `<div class="stk">${t("out")}</div>`;
  return `<div class="row"><div class="qty"><button data-cq="${p.id}" data-d="-1" ${qn<=1?"disabled":""}>−</button><span>${qn}</span><button data-cq="${p.id}" data-d="1" ${qn>=p.stock?"disabled":""}>+</button></div>
   ${hasW(p)&&p.min<=p.stock?`<button class="mini" data-cmin="${p.id}">${ic("add",14)} ${t("wsbtn")} (${p.min})</button>`:""}</div>
   <div class="ct ${ws?"ws":""}"><span>${ws?t("wsOn"):t("rtOn")}</span><b>${money(lineTotal(p,qn))}</b></div>
   <button class="add" data-add="${p.id}">🛒 ${t("add")}</button>
   <button class="wab" data-wa="${p.id}">💬 WhatsApp</button>`;
}
function lpFeatures(txt){ const L=txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean), f=[], r=[];
  L.forEach(l=>{ const m=l.match(/^[-•*✔✅✓]\s*(.+)$/); m?f.push(m[1]):r.push(l) }); return {f,r:r.join("\n")}; }
function lpReviews(id){ const l=REV.filter(r=>r.product_id==id).slice(0,5);
  return l.map(r=>`<div class="rc"><div class="av">${r.avatar==="m"?`<img src="${IC.avatar_male}" alt="">`:r.avatar==="f"?`<img src="${IC.avatar_female}" alt="">`:esc((r.name||"?").trim().charAt(0).toUpperCase())}</div><div class="bd"><div><b>${esc(r.name)}</b> <span class="st">${stars(r.rating)}</span></div>${r.comment?`<p>${esc(r.comment)}</p>`:""}</div></div>`).join(""); }
function lpHtml(p){
  const out=p.stock<=0, desc=(p[lang==="ar"?"dar":"dfr"]||"").trim(), ft=lpFeatures(desc), s=stat(p.id);
  const imgs=(p.imgs&&p.imgs.length)?p.imgs:(p.img?[p.img]:[]);
  const sim=DB.products.filter(x=>x.id!=p.id&&x.cat===p.cat&&x.active!==false&&x.stock>0).slice(0,4);
  const save=hasW(p)?Math.round(p.retail-p.wholesale):0;
  return `<div class="in"><button class="lpb" data-lpx>${lang==="ar"?"→":"←"} ${t("back")}</button>
   <div class="pic" style="background:${esc(p.bg||"#eee")}">${pics(p)}${p.hot?`<span class="hot">🔥 ${t("hot")}</span>`:""}${disc(p)?`<span class="tag d">-${pct(p)}%</span>`:p.offer?`<span class="tag">${t("offer")}</span>`:""}${out?`<div class="so">${t("out")}</div>`:""}</div>
   ${imgs.length>1?`<div class="ths">${imgs.map((u,k)=>`<button data-th="${k}">${imgTag(u)}</button>`).join("")}</div>`:""}
   <div class="sku" style="margin-top:12px">CMC${String(p.id).padStart(3,"0")} · <span class="chip">${CI[p.cat]||"📦"} ${t(p.cat)||""}</span></div>
   <h1>${esc(p[lang])}</h1>${ratingBtn(p)}
   <div class="pbox"><div class="price"><b>${money(p.retail)}</b>${disc(p)?`<s>${money(p.old_price)}</s><span class="sv">${t("saveT")} ${money(p.old_price-p.retail)}</span>`:""}</div>
    ${disc(p)&&p.offer_end?`<div class="cd">${ic("clock",18)} ${t("ends")} <b data-end="${esc(p.offer_end)}">${cdText(p.offer_end)}</b></div>`:""}
    ${!out&&p.stock<=10?`<div class="urg">🔥 ${t("onlyL")} ${p.stock} ${t("pcs")}</div>`:""}</div>
   <div class="trust"><div>${ic("delivery",30)}<span>${t("tr1")}</span></div><div>${ic("check",30)}<span>${t("tr2")}</span></div><div>${ic("chat_people",30)}<span>${t("tr3")}</span></div></div>
   ${hasW(p)?`<div class="wbox">${ic("handshake",34)}<div><b>${t("wholesale")}: ${money(p.wholesale)} / ${t("pcs")}</b><br><small>${t("from")} ${p.min} ${t("pcs")}${save>0?" · "+t("saveT")+" "+money(save)+" / "+t("pcs"):""}</small></div></div>`:""}
   <div class="lpact" id="lpAct">${lpAct(p)}</div>
   ${ft.f.length?`<div class="lph">${t("featT")}</div><ul class="feat">${ft.f.map(x=>`<li>${ic("check",20)}<span>${esc(x)}</span></li>`).join("")}</ul>`:""}
   ${ft.r?`<div class="lph">${t("descT")}</div><div class="lpd">${esc(ft.r)}</div>`:""}
   ${p.video?`<div class="lph">${t("vidT")}</div><div class="lpv">${videoHtml(p.video)}</div>`:""}
   <div class="lph">${t("howT")}</div><ol class="steps"><li>${t("st1")}</li><li>${t("st2")}</li><li>${t("st3")}</li></ol>
   <div class="lph">${ic("chat_people",22)} ${t("revT")}</div>
   <div class="rsum">${s.n?`<span class="st big">${stars(s.avg)}</span> <b>${s.avg.toFixed(1)}</b> / 5 · ${s.n}`:t("noRev")}</div>${lpReviews(p.id)}
   <button class="lpb" data-rev="${p.id}" style="margin-top:8px">⭐ ${t("rate")}</button>
   ${sim.length?`<div class="lph">${t("simT")}</div><div class="sims">${sim.map(x=>`<div class="sim" data-open="${x.id}"><div class="sp" style="background:${esc(x.bg||"#eee")}">${thumb(x)}</div><b>${esc(x[lang])}</b><span>${money(x.retail)}</span></div>`).join("")}</div>`:""}
   <button class="lpb" data-share="${p.id}" style="margin-top:16px">🔗 ${t("share")}</button></div>
   ${out?"":`<div class="lpbar"><div class="pp"><small>${t("retail")}</small><b>${money(p.retail)}</b></div><button class="buy" data-buy="${p.id}">🛒 ${t("buyNow")}</button><button class="wa2" data-wa="${p.id}" aria-label="WhatsApp">💬</button></div>`}`;
}
function showLp(id){ const p=P(id); if(!p){hideLp();return}
  const keep=lpId==id?$("#lp").scrollTop:0; lpId=id; $("#lp").innerHTML=lpHtml(p); $("#lp").classList.add("on"); $("#lp").scrollTop=keep;
  document.body.style.overflow="hidden"; document.title=p[lang]+" | MCCOLIS MAROC"; }
function hideLp(){ lpId=null; const el=$("#lp"); el.classList.remove("on"); el.innerHTML=""; document.body.style.overflow=""; document.title="MCCOLIS MAROC"; }
function openLp(id){ lpInternal=true; location.hash="p"+id; }
function closeLp(){ if(lpInternal){lpInternal=false;history.back()} else {history.replaceState(null,"",location.pathname+location.search);hideLp()} }
function route(){ const m=/^#p(\d+)$/.exec(location.hash); if(m&&P(m[1]))showLp(m[1]); else hideLp(); }
window.addEventListener("hashchange",route);
document.addEventListener("click",e=>{ const g=a=>e.target.closest("["+a+"]"); let x;
  if(x=g("data-open"))openLp(x.dataset.open);
  else if(g("data-lpx"))closeLp();
  else if(x=g("data-th")){ const sl=document.querySelector("#lp .sl"); if(sl&&sl.children[+x.dataset.th])sl.children[+x.dataset.th].scrollIntoView({behavior:"smooth",inline:"start",block:"nearest"}) }
  else if(g("data-buy")){ const b=document.querySelector("#lpAct [data-add]"); if(b)b.click(); openCart(true) }
  else if(x=g("data-share")){ const u=location.origin+location.pathname+"#p"+x.dataset.share, p=P(x.dataset.share);
    if(navigator.share)navigator.share({title:p[lang],url:u}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast(t("copied")));
    else prompt("",u); } });
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&lpId&&!$("#rv").classList.contains("on"))closeLp()});

const SB_URL="https://wrkuevqtrugzufpwsomr.supabase.co", SB_KEY="sb_publishable_ZBcufnBI-cLy14WZhKp4rQ_tyQNid-M";
const SB_ON=SB_KEY.startsWith("sb_publishable_")||SB_KEY.startsWith("eyJ");
let SYNC=false;
const sb=(path,opt={})=>fetch(SB_URL+"/rest/v1/"+path,{...opt,headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",...(opt.headers||{})}});
function valid(d){return d&&d.settings&&Array.isArray(d.products)}
async function loadData(){
  if(SB_ON){ try{ try{await sb("rpc/expire_offers",{method:"POST",body:"{}"})}catch(_){}
    const [a,b]=await Promise.all([sb("products?select=*&active=eq.true&order=id"),sb("settings?select=data&id=eq.1")]);
    if(a.ok){ const prods=await a.json();
      if(prods.length){ const st=b.ok?(await b.json())[0]:null;
        DB={settings:Object.assign({},DEFAULTS.settings,st&&st.data),products:prods.map(normP)}; SYNC=true; return } }
  }catch(e){} }
  try{const r=await fetch("products.json",{cache:"no-cache"});if(r.ok){const d=await r.json();if(valid(d)){DB=d;DB.products.forEach(normP)}}}catch(e){}
}
async function init(){ document.querySelectorAll(".x").forEach(b=>b.innerHTML=ic("error",28)); await loadData(); await loadReviews(); clampCart(); save(); applyLang(); route(); }
init();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
