<title>MCCOLIS MAROC</title>
<style>
:root{--ink:#1c2630;--mut:#66727e;--bg:#faf7f1;--line:#e8e2d6;--teal:#0f5c6e;--teal2:#0b4553;--gold:#e9a31b;--wa:#1faa59;--red:#c2410c;--ws:#7c3aed}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",Tahoma,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1000px;margin:auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-weight:800;font-size:1.15rem}.logo b{color:var(--gold)}
.tools{display:flex;gap:8px}
.pill{background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:6px 12px;font-size:.9rem;font-weight:600;position:relative}
.pill span{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--gold);color:var(--ink);min-width:20px;height:20px;border-radius:10px;font-size:.75rem;display:grid;place-items:center;font-weight:800}
.hero{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:24px 0 28px}
.hero h1{font-size:1.55rem;line-height:1.35;max-width:560px}
.hero p{margin:8px 0 0;opacity:.92;max-width:540px}
.ban{background:#ede9fe;color:#4c1d95;border-radius:10px;padding:9px 12px;margin-top:14px;font-size:.88rem}
.demo{background:#fff3d6;border:1px solid #f0d58a;border-radius:10px;padding:9px 12px;margin-top:12px;font-size:.84rem}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600}
.cat[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.search{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 0 30px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:2rem}}
.p{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:1/1;display:grid;place-items:center;font-size:3.4rem;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;height:100%;scrollbar-width:none}.sl::-webkit-scrollbar{display:none}.sl img{flex:none;width:100%;scroll-snap-align:center}
.dots{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.25)}.dots i.on{background:var(--teal,#0e7490)}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--red);color:#fff;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px}
.so{position:absolute;inset:0;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:1rem;font-weight:800;color:var(--red)}
.info{padding:10px 11px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.nm{font-size:.95rem;font-weight:700;line-height:1.35}
.ds{font-size:.8rem;color:var(--mut)}
.pl{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;gap:6px}
.pl b{font-size:1rem;color:var(--teal)}
.pl.w b{color:var(--ws)}
.stk{font-size:.75rem;color:var(--mut)}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between}
.qty{display:flex;align-items:center}
.qty button{width:32px;height:32px;border-radius:8px;background:#efeae0;font-weight:800}
.qty span{min-width:28px;text-align:center;font-weight:700}
.qty button:disabled{opacity:.4}
.mini{font-size:.74rem;background:#ede9fe;color:#4c1d95;border-radius:8px;padding:6px 8px;font-weight:700}
.ct{display:flex;justify-content:space-between;align-items:center;background:#f4f1ea;border-radius:9px;padding:6px 9px;font-size:.8rem}
.ct b{font-size:1.02rem}
.ct.ws{background:#ede9fe;color:#4c1d95}
.add{background:var(--teal);color:#fff;border-radius:9px;padding:9px;font-weight:700}
.wab{background:#e7f7ee;color:#117a3d;border-radius:9px;padding:8px;font-weight:700;font-size:.88rem}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px 0}
footer{background:var(--ink);color:#cfd6dc;padding:20px 0 90px;font-size:.88rem}
footer b{color:#fff}
.float{position:fixed;bottom:16px;inset-inline-start:16px;z-index:15;background:var(--wa);color:#fff;border-radius:99px;padding:12px 18px;font-weight:700;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none}.shade.on{display:block}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(430px,100%);background:#fff;z-index:31;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s}
[dir=rtl] .drawer{transform:translateX(-100%)}
.drawer.on{transform:none!important}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:1.1rem}
.db{flex:1;overflow-y:auto;padding:8px 16px}
.it{padding:10px 0;border-bottom:1px dashed var(--line)}
.it .top{display:flex;gap:10px;align-items:center}
.it .e{font-size:1.6rem;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;overflow:hidden}
.it .e img{width:100%;height:100%;object-fit:cover}
.it .t{flex:1;font-size:.9rem}
.it small{display:block;color:var(--mut);font-size:.78rem}
.hint{font-size:.78rem;color:#4c1d95;background:#f5f3ff;border-radius:8px;padding:5px 8px;margin-top:6px}
.badge{background:var(--ws);color:#fff;border-radius:6px;font-size:.7rem;padding:1px 7px;font-weight:700}
.df{border-top:1px solid var(--line);padding:12px 16px;background:#fcfaf5;max-height:62vh;overflow-y:auto}
.sub{display:flex;justify-content:space-between;color:var(--mut);font-size:.88rem}
.sub.g{color:#117a3d;font-weight:700}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;margin:6px 0 8px}
form{display:grid;gap:8px;margin-top:8px}
form input,form select,form textarea{width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);background:#fff}
.bad{border-color:var(--red)!important}
.info2{font-size:.84rem;background:#f4f1ea;border-radius:9px;padding:8px 10px}
.send{background:var(--wa);color:#fff;border-radius:10px;padding:12px;font-weight:800;width:100%}
.x{font-size:1.4rem;padding:2px 8px}
.note{font-size:.76rem;color:var(--mut)}
.err{color:var(--red);font-size:.82rem;min-height:1em}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:.88rem;z-index:40;display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $ = s => document.querySelector(s);
let lang="ar", cat="all", qtext="", cart={}, cq={}, DB=DEFAULTS;
try{ lang=localStorage.getItem("mm_lang")||"ar"; cart=JSON.parse(localStorage.getItem("mm_cart")||"{}"); }catch(e){}
const t = k => T[lang][k];
const money = n => (Math.round(n*100)/100).toLocaleString(lang==="ar"?"ar-MA-u-nu-latn":"fr-FR") + " " + t("dh");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P = id => DB.products.find(p=>p.id==id);
const save = () => { try{ localStorage.setItem("mm_cart",JSON.stringify(cart)); localStorage.setItem("mm_lang",lang);}catch(e){} };

/* ===== منطق الأثمنة (الجملة تُطبَّق فقط عند بلوغ الحد الأدنى) ===== */
const hasW = p => p.wholesale>0 && p.wholesale<p.retail;
const isWs = (p,q) => hasW(p) && q>=p.min;
const unit = (p,q) => isWs(p,q) ? p.wholesale : p.retail;
const lineTotal = (p,q) => unit(p,q)*q;
const lineSave = (p,q) => isWs(p,q) ? (p.retail-p.wholesale)*q : 0;

function totals(){
  let sub=0,saved=0,n=0,ws=0,rt=0;
  for(const id in cart){ const p=P(id); if(!p) continue; const q=cart[id];
    sub+=lineTotal(p,q); saved+=lineSave(p,q); n+=q; isWs(p,q)?ws++:rt++; }
  const s=DB.settings, ship = sub===0?0:(sub>=s.freeFrom?0:s.shipping);
  const type = ws&&rt?"tmix":ws?"tws":"trt";
  return {sub,saved,n,ship,total:sub+ship,type};
}
function clampCart(){
  let changed=false;
  for(const id in cart){ const p=P(id);
    if(!p||p.stock<=0){delete cart[id];changed=true;continue}
    if(cart[id]>p.stock){cart[id]=p.stock;changed=true}
    if(cart[id]<1){delete cart[id];changed=true} }
  return changed;
}

/* ===== العرض ===== */
const first = p => (p.imgs&&p.imgs[0])||p.img;
const pics = p => { const l=(p.imgs&&p.imgs.length)?p.imgs:(p.img?[p.img]:[]);
  if(l.length<2) return thumb(p);
  return `<div class="sl">${l.map(u=>`<img src="${esc(u)}" alt="" loading="lazy">`).join("")}</div><div class="dots">${l.map((_,k)=>`<i class="${k?"":"on"}"></i>`).join("")}</div>`; };
document.addEventListener("scroll",e=>{const s=e.target;if(!s.classList||!s.classList.contains("sl"))return;const n=Math.round(Math.abs(s.scrollLeft)/s.clientWidth);[...s.nextElementSibling.children].forEach((d,k)=>d.classList.toggle("on",k===n))},true);
const thumb = p => first(p) ? `<img src="${esc(first(p))}" alt="" loading="lazy">` : `<span aria-hidden="true">${esc(p.e||"📦")}</span>`;
function card(p){
  const out=p.stock<=0, qn=out?1:Math.min(Math.max(cq[p.id]||1,1),p.stock); cq[p.id]=qn;
  const ws=isWs(p,qn);
  return `<article class="p" id="c${p.id}">
   <div class="pic" style="background:${esc(p.bg||"#eee")}">${pics(p)}${p.offer?`<span class="tag">${t("offer")}</span>`:""}${out?`<div class="so">${t("out")}</div>`:""}</div>
   <div class="info"><div class="nm">${esc(p[lang])}</div><div class="ds">${esc(p[lang==="ar"?"dar":"dfr"])}</div>
   <div class="pl"><span>${t("retail")}</span><b>${money(p.retail)}</b></div>
   ${hasW(p)?`<div class="pl w"><span>${t("wholesale")} · ${t("from")} ${p.min} ${t("pcs")}</span><b>${money(p.wholesale)}</b></div>`:""}
   <div class="stk">${out?t("out"):t("stock")+": "+p.stock}</div>
   ${out?"":`<div class="row"><div class="qty"><button data-cq="${p.id}" data-d="-1" ${qn<=1?"disabled":""}>−</button><span>${qn}</span><button data-cq="${p.id}" data-d="1" ${qn>=p.stock?"disabled":""}>+</button></div>
   ${hasW(p)&&p.min<=p.stock?`<button class="mini" data-cmin="${p.id}">${t("wsbtn")} (${p.min})</button>`:""}</div>
   <div class="ct ${ws?"ws":""}"><span>${ws?t("wsOn"):t("rtOn")}</span><b>${money(lineTotal(p,qn))}</b></div>
   <button class="add" data-add="${p.id}">${t("add")}</button>
   <button class="wab" data-wa="${p.id}">💬 WhatsApp</button>`}
   </div></article>`;
}
function renderCats(){
  $("#cats").innerHTML=["all","offers","home","kitchen","perf","elec","acc"].map(c=>`<button class="cat" data-c="${c}" aria-pressed="${c===cat}">${t(c)}</button>`).join("");
}
function renderGrid(){
  const q=qtext.trim().toLowerCase();
  const list=DB.products.filter(p=>(cat==="all"||(cat==="offers"?p.offer:p.cat===cat))&&(!q||(p.ar+" "+p.fr).toLowerCase().includes(q)));
  $("#grid").innerHTML=list.length?list.map(card).join(""):`<p class="empty">${t("noRes")}</p>`;
}
function renderCart(){
  const T0=totals(); $("#cnt").textContent=T0.n;
  const ids=Object.keys(cart).filter(id=>P(id));
  $("#items").innerHTML=ids.length?ids.map(id=>{
    const p=P(id),q=cart[id],ws=isWs(p,q);
    const hint=hasW(p)&&!ws?t("hint").replace("{n}",p.min-q).replace("{s}",money((p.retail-p.wholesale)*p.min)):"";
    return `<div class="it"><div class="top"><div class="e" style="background:${esc(p.bg||"#eee")}">${thumb(p)}</div>
     <div class="t">${esc(p[lang])}<small>${money(unit(p,q))} ${t("unit")} <span class="badge" ${ws?"":'style="background:#66727e"'}>${t(ws?"wsTag":"rtTag")}</span></small><b>${money(lineTotal(p,q))}</b></div>
     <div class="qty"><button data-q="${id}" data-d="-1">−</button><span>${q}</span><button data-q="${id}" data-d="1" ${q>=p.stock?"disabled":""}>+</button></div></div>
     ${hint?`<div class="hint">${hint}</div>`:""}</div>`;
  }).join(""):`<p class="empty">${t("empty")}</p>`;
  if(!ids.length){ $("#fform").innerHTML=""; return; }
  const keep=["fn","fp","fc","fa"].map(i=>$("#"+i)?$("#"+i).value:"");
  $("#fform").innerHTML=`
   <div class="sub"><span>${t("sub2")}</span><span>${money(T0.sub)}</span></div>
   ${T0.saved?`<div class="sub g"><span>${t("saved")}</span><span>− ${money(T0.saved)}</span></div>`:""}
   <div class="sub"><span>${t("ship")}</span><span>${T0.ship?money(T0.ship):t("free")}</span></div>
   <div class="tot"><span>${t("total")}</span><span>${money(T0.total)}</span></div>
   <form id="order" novalidate>
    <input id="fn" autocomplete="name" placeholder="${t("name")}">
    <input id="fp" type="tel" inputmode="tel" autocomplete="tel" placeholder="${t("phone")}">
    <select id="fc"><option value="">${t("city")}</option>${CITIES.map(c=>`<option>${c}</option>`).join("")}</select>
    <textarea id="fa" rows="2" autocomplete="street-address" placeholder="${t("address")}"></textarea>
    <div class="info2">${t("stype")}: <b>${t(T0.type)}</b><br>${t("pay")}</div>
    <div class="err" id="err"></div>
    <button class="send" type="submit">${t("send")}</button><div class="note">${t("note")}</div></form>`;
  ["fn","fp","fc","fa"].forEach((i,k)=>$("#"+i).value=keep[k]);
}
function applyLang(){
  const L=T[lang];
  document.documentElement.lang=lang; document.documentElement.dir=L.dir;
  $("#lang").textContent=L.lang; $("#cartL").textContent=L.cart; $("#h1").textContent=L.h1; $("#sub").textContent=L.sub;
  $("#q").placeholder=L.search; $("#foot").textContent=L.foot; $("#cartT").textContent=L.cartT;
  const b=DB.settings.banner&&DB.settings.banner[lang]; $("#ban").hidden=!b; $("#ban").textContent=b||"";
  $("#demo").hidden=!DB.settings.demo; $("#demo").textContent=L.demo;
  $("#waFloat").href="https://wa.me/"+DB.settings.whatsapp+"?text="+encodeURIComponent(L.waGen);
  renderCats(); renderGrid(); renderCart();
}
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",1600)}
function openCart(on){$("#drawer").classList.toggle("on",on);$("#shade").classList.toggle("on",on);document.body.style.overflow=on?"hidden":""}
const redraw = id => { const el=$("#c"+id); if(el) el.outerHTML=card(P(id)); };

/* ===== الأحداث ===== */
document.addEventListener("click",e=>{
  const g=a=>e.target.closest("["+a+"]");
  let x;
  if(x=g("data-cq")){const id=x.dataset.cq,p=P(id);cq[id]=Math.min(p.stock,Math.max(1,(cq[id]||1)+Number(x.dataset.d)));redraw(id)}
  else if(x=g("data-cmin")){const id=x.dataset.cmin;cq[id]=P(id).min;redraw(id)}
  else if(x=g("data-add")){const id=x.dataset.add,p=P(id);cart[id]=Math.min(p.stock,(cart[id]||0)+(cq[id]||1));save();renderCart();toast(t("added"))}
  else if(x=g("data-wa")){const id=x.dataset.wa,p=P(id),q=cq[id]||1;
    const m=[t("waOne"),`${p[lang]} × ${q}`,`${t(isWs(p,q)?"wsTag":"rtTag")}: ${money(unit(p,q))} ${t("unit")}`,`${t("sub2")}: ${money(lineTotal(p,q))}`].join("\n");
    window.open("https://wa.me/"+DB.settings.whatsapp+"?text="+encodeURIComponent(m),"_blank")}
  else if(x=g("data-c")){cat=x.dataset.c;renderCats();renderGrid()}
  else if(x=g("data-q")){const id=x.dataset.q,p=P(id);cart[id]=Math.min(p.stock,(cart[id]||0)+Number(x.dataset.d));if(cart[id]<=0)delete cart[id];save();renderCart()}
});
$("#q").addEventListener("input",e=>{qtext=e.target.value;renderGrid()});
$("#lang").addEventListener("click",()=>{lang=lang==="ar"?"fr":"ar";save();applyLang()});
$("#openCart").addEventListener("click",()=>openCart(true));
$("#closeCart").addEventListener("click",()=>openCart(false));
$("#shade").addEventListener("click",()=>openCart(false));
document.addEventListener("keydown",e=>{if(e.key==="Escape")openCart(false)});

document.addEventListener("submit",async e=>{
  if(e.target.id!=="order")return; e.preventDefault();
  if(clampCart()){save();renderCart();$("#err").textContent=t("stockErr");return}
  const f={n:$("#fn"),p:$("#fp"),c:$("#fc"),a:$("#fa")}, phone=f.p.value.replace(/[\s.\-]/g,"");
  const ok={n:f.n.value.trim().length>=3,p:/^(\+212|00212|0)[5-7]\d{8}$/.test(phone),c:!!f.c.value,a:f.a.value.trim().length>=8};
  for(const k in f)f[k].classList.toggle("bad",!ok[k]);
  if(!(ok.n&&ok.p&&ok.c&&ok.a)){$("#err").textContent=t("need");return}
  const btn=e.target.querySelector(".send"); btn.disabled=true; $("#err").textContent="";
  const lines0=Object.keys(cart).map(id=>{const p=P(id),q=cart[id];
    return `• ${p[lang]} × ${q} [${t(isWs(p,q)?"wsTag":"rtTag")}] ${money(unit(p,q))} ${t("unit")} = ${money(lineTotal(p,q))}`});
  let ord=null;
  if(SYNC){ try{
    const items=Object.keys(cart).map(id=>({id:Number(id),qty:cart[id]}));
    const r=await sb("rpc/place_order",{method:"POST",body:JSON.stringify({p_name:f.n.value.trim(),p_phone:phone,p_city:f.c.value,p_address:f.a.value.trim(),p_items:items})});
    const j=await r.json();
    if(r.ok) ord=j;
    else if(/out_of_stock|not_found/.test(JSON.stringify(j))){await loadData();clampCart();save();applyLang();$("#err").textContent=t("stockErr");btn.disabled=false;return}
  }catch(_){} }
  const T0=ord?{sub:ord.subtotal,saved:ord.savings,ship:ord.shipping,total:ord.total,type:{wholesale:"tws",retail:"trt",mixed:"tmix"}[ord.type]}:totals();
  const msg=[t("waHi"),...(ord?[`${t("orderNo")}: #${ord.id}`]:SYNC?[t("unsaved")]:[]),"",...lines0,"",`${t("stype")}: ${t(T0.type)}`,`${t("sub2")}: ${money(T0.sub)}`,
   ...(T0.saved?[`${t("saved")}: ${money(T0.saved)}`]:[]),`${t("ship")}: ${T0.ship?money(T0.ship):t("free")}`,`*${t("total")}: ${money(T0.total)}*`,"",
   `${t("waC")}:`,`${t("waN")}: ${f.n.value.trim()}`,`${t("waP")}: ${phone}`,`${t("waCi")}: ${f.c.value}`,`${t("waA")}: ${f.a.value.trim()}`,"",t("pay")].join("\n");
  const url="https://wa.me/"+DB.settings.whatsapp+"?text="+encodeURIComponent(msg);
  const head=ord?`${t("savedOk")} (#${ord.id})`:(SYNC?t("unsaved"):"");
  if(ord){cart={};save();renderCart();loadData().then(()=>renderGrid())}
  $("#fform").innerHTML=`<p style="margin:6px 0 12px;font-weight:700">${esc(head)}</p><a class="send" style="display:block;text-align:center;text-decoration:none" href="${url}" target="_blank" rel="noopener">${t("openWa")}</a>`;
});

/* ===== التحميل: Supabase إن وُجد، وإلا products.json ===== */
const SB_URL="https://wrkuevqtrugzufpwsomr.supabase.co", SB_KEY="sb_publishable_ZBcufnBI-cLy14WZhKp4rQ_tyQNid-M";
const SB_ON=SB_KEY.startsWith("sb_publishable_")||SB_KEY.startsWith("eyJ");
let SYNC=false;
const sb=(path,opt={})=>fetch(SB_URL+"/rest/v1/"+path,{...opt,headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",...(opt.headers||{})}});
function valid(d){return d&&d.settings&&Array.isArray(d.products)}
async function loadData(){
  if(SB_ON){ try{
    const [a,b]=await Promise.all([sb("products?select=*&active=eq.true&order=id"),sb("settings?select=data&id=eq.1")]);
    if(a.ok){ const prods=await a.json();
      if(prods.length){ const st=b.ok?(await b.json())[0]:null;
        DB={settings:Object.assign({},DEFAULTS.settings,st&&st.data),products:prods}; SYNC=true; return } }
  }catch(e){} }
  try{const r=await fetch("products.json",{cache:"no-cache"});if(r.ok){const d=await r.json();if(valid(d))DB=d}}catch(e){}
}
async function init(){ await loadData(); clampCart(); save(); applyLang(); }
init();
</script>
</body>
